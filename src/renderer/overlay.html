<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
  <link rel="stylesheet" href="glass.css">
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="hint" class="hint glass">
    <svg class="hint-mark" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-dasharray="44 9.4" transform="rotate(-50 12 12)"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
    Click an object <span class="dot"></span> Circle or drag <span class="dot"></span> <kbd>Ctrl A</kbd> whole screen <span class="dot"></span> <kbd>Esc</kbd> cancel
  </div>

  <div id="ask" class="ask glass" hidden>
    <div class="ask-row">
      <canvas id="thumb" class="thumb" width="72" height="72"></canvas>
      <input id="q" type="text" placeholder="Ask about this..." autocomplete="off" spellcheck="false">
      <div class="seg" id="model">
        <button data-model="fast">Fast</button>
        <button data-model="smart">Smart</button>
      </div>
      <button id="send" class="send" title="Send (Enter)">
        <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
